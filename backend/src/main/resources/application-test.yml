spring:
  datasource:
    url: jdbc:h2:mem:mandiwise_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

mandiwise:
  python-service:
    url: http://localhost:8000
  security:
    jwt:
      secret: mandiwiseTestSecretKeyForDevTokenGenerationWithSufficientEntropy2026!
      expiration-ms: 3600000
