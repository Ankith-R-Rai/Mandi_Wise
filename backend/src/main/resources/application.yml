server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:file:./.env[.properties]
  application:
    name: mandiwise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: "local | test"
  datasource:
    url: jdbc:h2:mem:mandiwise;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.tzncfzzaquyvdhblzgdm}
    password: ${DB_PASSWORD:Ankith@supabase26}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# Custom Application Config
mandiwise:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  security:
    jwt:
      secret: ${JWT_SECRET:mandiwiseSecretKeyForDevTokenGenerationWithSufficientEntropy2026!}
      expiration-ms: 86400000 # 24 hours
