server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mandiwise-backend
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.tzncfzzaquyvdhblzgdm.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# Custom Application Config
mandiwise:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  security:
    jwt:
      secret: ${JWT_SECRET:mandiwiseSecretKeyForDevTokenGenerationWithSufficientEntropy2026!}
      expiration-ms: 86400000 # 24 hours
